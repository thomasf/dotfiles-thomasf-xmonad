public = true

[vars]
dpi = '{{ expr `{"flam": 165, "yak": 170}[hostname] ?? 170` }}'

[[script]]
condition = "os == 'linux'"
src= '''
create-alacritty-config -os linux -host transwhale -out alacritty.transwhale
create-alacritty-config -os linux -host flam -out alacritty.flam
'''

[[script]]
src= '''
create-alacritty-config
'''

[[go]]
src = 'cmd/batt'
condition = "os == 'linux' && hostname in ['yak']"

[[go]]
src = 'cmd/recordwindow'
condition = "os == 'linux'"

[[go]]
src = 'cmd/sshot'
condition = "os == 'linux'"

[[go]]
src = 'cmd/panels'
condition = "os == 'linux'"

[[mount]]
src = 'config-xmonad/dunstrc'
dst = '.config/dunst/dunstrc'

[[mount]]
src = 'config-xmonad/gtk/gtk-3.0'
dst = '.config/gtk-3.0'

[[mount]]
src = 'config-xmonad/gtk/themes'
dst = '.themes'

[[mount]]
src = 'config-xmonad/alacritty'
dst = '.config/alacritty'

[[mount]]
src = 'config-xmonad/fontconfig/conf.d'
dst = '.fonts.conf.d'

[[template]]
condition = "os == 'linux'"
src = 'config-xmonad/xresources/Xresources.tmpl'
dst = '.Xresources'


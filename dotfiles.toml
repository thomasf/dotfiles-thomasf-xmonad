public = true

[default_vars]
dpi = '170'

[vars]
dpi_scale     = '{{ expr `float(vars.dpi) / 96.0` }}'
dpi_scale_int = '{{ expr `int(round(float(vars.dpi) / 96.0))` }}'
cursor_size   = '{{ expr `int(round(float(vars.dpi) / 96.0)) * 24` }}'
hidpi         = '{{ expr `int(vars.dpi) >= 144` }}'

[[go]]
src = 'cmd/batt'
condition = "os == 'linux' && hostname in ['yak']"

[[go]]
src = 'cmd/recordwindow'
condition = "os == 'linux'"

[[go]]
src = 'cmd/sshot'
condition = "os == 'linux'"

[[go]]
src = 'cmd/panels'
condition = "os == 'linux'"

[[go]]
src = 'cmd/ws'
condition = "os == 'linux'"

[[go]]
src = 'cmd/kbd'
condition = "os == 'linux'"

[[template]]
src = 'config-xmonad/dunstrc.tmpl'
dst = '.config/dunst/dunstrc'

[[mount]]
src = 'config-xmonad/gtk/gtk-3.0'
dst = '.config/gtk-3.0'

[[template]]
condition = "os == 'linux'"
src = 'config-xmonad/gtk/gtk-4.0/gtk.css.tmpl'
dst = '.config/gtk-4.0/gtk.css'

[[mount]]
src = 'config-xmonad/alacritty'
dst = '.config/alacritty'

[[starlark]]
dst = '.config/alacritty/alacritty.toml'
missing = 'create'
src = '''
l = "config-xmonad/alacritty/layers/"
c = theme["colors"]
term = theme["terminal"]
doc.clear()
merge(doc, read(l + "common.toml"))
merge(doc, {"colors": {
    "primary": {"background": c["bg_0"], "foreground": c["fg_0"]},
    "cursor": {"text": c["bg_0"], "cursor": c["fg_0"]},
    "normal": term["normal"],
    "bright": term["bright"],
    "selection": {"text": c["bg_0"], "background": c["orange"]},
    "search": {"matches": {"foreground": c["bg_0"], "background": c["violet"]}},
    "footer_bar": {"foreground": c["bg_0"], "background": c["blue"]},
}})
merge(doc, read(l + "os." + os + ".toml", default = {}))
pad = 2 * int(vars.get("dpi_scale_int", "1"))
merge(doc, {
    "window": {"padding": {"x": pad, "y": pad}},
})
merge(doc, read(l + "host." + hostname.split(".")[0] + ".toml", default = {}))
'''

[[mount]]
src = 'config-xmonad/kitty'
dst = '.config/kitty'

# kitty in the colors of the theme in use, set up like alacritty.
[[template]]
src = 'config-xmonad/kitty/kitty.conf.tmpl'
dst = '.config/kitty/kitty.conf'

[[mount]]
src = 'config-xmonad/fontconfig/conf.d'
dst = '.fonts.conf.d'

[[template]]
condition = "os == 'linux'"
src = 'config-xmonad/xresources/Xresources.tmpl'
dst = '.Xresources'

[[template]]
condition = "os == 'linux'"
src = 'config-xmonad/rofi/config.rasi.tmpl'
dst = '.config/rofi/config.rasi'

[[template]]
condition = "os == 'linux'"
src = 'config-xmonad/rofi/colors.rasi.tmpl'
dst = '.config/rofi/colors.rasi'

# The colors of the theme in use for xmonad, which reads them when it starts.
[[template]]
condition = "os == 'linux'"
src = 'config-xmonad/xmonad-palette.tmpl'
dst = '.config/theme/xmonad-palette'

[[template]]
condition = "os == 'linux'"
src = 'config-xmonad/xsettingsd.tmpl'
dst = '.xsettingsd'

# clean up after replacing links with templates, which do not replace a
# link: rofi's colors.rasi linked to dark.rasi or light.rasi, and dunstrc was
# mounted
[[script]]
phase = 'pre'
on = ['install', 'theme']
condition = "os == 'linux'"
src = '''
for f in ~/.config/rofi/colors.rasi ~/.config/rofi/dark.rasi ~/.config/rofi/light.rasi ~/.config/dunst/dunstrc ~/.config/gtk-4.0; do
  if [ -L "$f" ]; then rm "$f"; fi
done
'''


# Reload the desktop when dotfiles theme switches the theme, after the files
# of every repository are written: the root window background, the panels, X
# resources, dunst, kitty, the GTK color scheme and xmonad. A theme without a
# background gets its bg_0. Nothing is reloaded if no X server answers on DISPLAY, as
# over ssh with a stale DISPLAY: panels, for one, panics without it.
[[script]]
on = 'theme'
phase = 'post'
condition = "os == 'linux' && env('DISPLAY') != ''"
src = '''
if ! xset q >/dev/null 2>&1; then
  exit 0
fi
{{- if not (lookPath "hsetroot")}}
xsetroot -solid {{shellQuote .theme.colors.bg_0}}
{{- else}}
hsetroot -root {{shellQuote (printf "-%s" (or (index .theme.apps "background_mode") "tile"))}} "$(dotfiles theme background-image)" >/dev/null
{{- end}}
panels
xrdb -merge ~/.Xresources
xsetroot -cursor_name left_ptr
if pgrep -x dunst >/dev/null; then
  dunstctl reload
fi
if pgrep -x xsettingsd >/dev/null; then
  pkill -HUP -x xsettingsd
fi
if pgrep -x kitty >/dev/null; then
  pkill -USR1 -x kitty
fi
{{- if lookPath "gsettings"}}
gsettings set org.gnome.desktop.interface color-scheme {{shellQuote (or (index .theme.apps "color_scheme") (printf "prefer-%s" .theme.mode))}}
{{- end}}
xmonad --restart
'''

public = true

[vars]
dpi = '{{ expr `{"flam": 165, "yak": 170}[hostname] ?? 170` }}'

[[script]]
# clean up after replacing the command with [[starlark]]
src='rm -f ~/bin/create-alacritty-config'

[[go]]
src = 'cmd/batt'
condition = "os == 'linux' && hostname in ['yak']"

[[go]]
src = 'cmd/recordwindow'
condition = "os == 'linux'"

[[go]]
src = 'cmd/sshot'
condition = "os == 'linux'"

[[go]]
src = 'cmd/panels'
condition = "os == 'linux'"

[[go]]
src = 'cmd/ws'
condition = "os == 'linux'"

[[go]]
src = 'cmd/kbd'
condition = "os == 'linux'"

[[mount]]
src = 'config-xmonad/dunstrc'
dst = '.config/dunst/dunstrc'

[[mount]]
src = 'config-xmonad/gtk/gtk-3.0'
dst = '.config/gtk-3.0'

[[mount]]
src = 'config-xmonad/alacritty'
dst = '.config/alacritty'

[[starlark]]
dst = '.config/alacritty/alacritty.toml'
missing = 'create'
src = '''
l = "config-xmonad/alacritty/layers/"
c = theme["colors"]
names = ["black", "red", "green", "yellow", "blue", "magenta", "cyan", "white"]
doc.clear()
merge(doc, read(l + "common.toml"))
merge(doc, {"colors": {
    "primary": {"background": c["bg_0"], "foreground": c["fg_0"]},
    "cursor": {"text": c["bg_0"], "cursor": c["fg_0"]},
    "normal": {n: c["color%d" % i] for i, n in enumerate(names)},
    "bright": {n: c["color%d" % (i + 8)] for i, n in enumerate(names)},
    "selection": {"text": c["bg_0"], "background": c["orange"]},
    "search": {"matches": {"foreground": c["bg_0"], "background": c["violet"]}},
    "footer_bar": {"foreground": c["bg_0"], "background": c["blue"]},
}})
merge(doc, read(l + "os." + os + ".toml", default = {}))
merge(doc, read(l + "host." + hostname.split(".")[0] + ".toml", default = {}))
'''

[[mount]]
src = 'config-xmonad/fontconfig/conf.d'
dst = '.fonts.conf.d'

[[template]]
condition = "os == 'linux'"
src = 'config-xmonad/xresources/Xresources.tmpl'
dst = '.Xresources'

[[template]]
condition = "os == 'linux'"
src = 'config-xmonad/rofi/config.rasi.tmpl'
dst = '.config/rofi/config.rasi'

[[template]]
condition = "os == 'linux'"
src = 'config-xmonad/rofi/colors.rasi.tmpl'
dst = '.config/rofi/colors.rasi'

# clean up after replacing dark.rasi and light.rasi, which darkmode linked
# colors.rasi to, with colors.rasi.tmpl: a template does not replace a link
[[script]]
phase = 'pre'
on = ['install', 'theme']
condition = "os == 'linux'"
src = '''
for f in colors dark light; do
  if [ -L ~/.config/rofi/$f.rasi ]; then rm ~/.config/rofi/$f.rasi; fi
done
'''


# Reload the desktop when dotfiles theme switches the theme, after the files
# of every repository are written: the root window background, the panels, X
# resources, the GTK color scheme and xmonad. A theme without a background
# gets its bg_0. Nothing is reloaded if no X server answers on DISPLAY, as
# over ssh with a stale DISPLAY: panels, for one, panics without it.
[[script]]
on = 'theme'
phase = 'post'
condition = "os == 'linux' && env('DISPLAY') != ''"
src = '''
if ! xset q >/dev/null 2>&1; then
  exit 0
fi
{{- $bg := or (index .theme.apps "background") ""}}
{{- if not (lookPath "hsetroot")}}
xsetroot -solid {{shellQuote .theme.colors.bg_0}}
{{- else if $bg}}
hsetroot {{shellQuote (printf "-%s" (or (index .theme.apps "background_mode") "tile"))}} {{shellQuote (printf "%s/%s" .theme.dir $bg)}} >/dev/null
{{- else}}
hsetroot -solid {{shellQuote .theme.colors.bg_0}} >/dev/null
{{- end}}
panels
xrdb -merge ~/.Xresources
{{- if lookPath "gsettings"}}
gsettings set org.gnome.desktop.interface color-scheme {{shellQuote (or (index .theme.apps "color_scheme") (printf "prefer-%s" .theme.mode))}}
{{- end}}
xmonad --restart
'''

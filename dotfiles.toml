public = true

[vars]
dpi = '{{ expr `{"flam": 165, "yak": 170}[hostname] ?? 170` }}'

[[script]]
# clean up after replacing the command with [[starlark]]
src='rm -f ~/bin/create-alacritty-config'

[[go]]
src = 'cmd/batt'
condition = "os == 'linux' && hostname in ['yak']"

[[go]]
src = 'cmd/recordwindow'
condition = "os == 'linux'"

[[go]]
src = 'cmd/sshot'
condition = "os == 'linux'"

[[go]]
src = 'cmd/panels'
condition = "os == 'linux'"

[[go]]
src = 'cmd/ws'
condition = "os == 'linux'"

[[go]]
src = 'cmd/kbd'
condition = "os == 'linux'"

[[mount]]
src = 'config-xmonad/dunstrc'
dst = '.config/dunst/dunstrc'

[[mount]]
src = 'config-xmonad/gtk/gtk-3.0'
dst = '.config/gtk-3.0'

[[mount]]
src = 'config-xmonad/alacritty'
dst = '.config/alacritty'

[[starlark]]
dst = '.config/alacritty/alacritty.toml'
missing = 'create'
src = '''
l = "config-xmonad/alacritty/layers/"
theme = "selenized-dark" if exists(".config/darkmode") else "selenized-light"
doc.clear()
merge(doc, read(l + "common.toml"))
merge(doc, read(l + "colors." + theme + ".toml"))
merge(doc, read(l + "os." + os + ".toml", default = {}))
merge(doc, read(l + "host." + hostname.split(".")[0] + ".toml", default = {}))
'''

[[mount]]
src = 'config-xmonad/fontconfig/conf.d'
dst = '.fonts.conf.d'

[[template]]
condition = "os == 'linux'"
src = 'config-xmonad/xresources/Xresources.tmpl'
dst = '.Xresources'

[[template]]
condition = "os == 'linux'"
src = 'config-xmonad/rofi/config.rasi.tmpl'
dst = '.config/rofi/config.rasi'

[[mount]]
condition = "os == 'linux'"
src = 'config-xmonad/rofi/dark.rasi'
dst = '.config/rofi/dark.rasi'

[[mount]]
condition = "os == 'linux'"
src = 'config-xmonad/rofi/light.rasi'
dst = '.config/rofi/light.rasi'

# rofi's colours: darkmode links colors.rasi to dark.rasi or light.rasi.
# Until it has run, link the one for the current mode.
# TODO: probably not like this
[[script]]
condition = "os == 'linux'"
src = '''
mkdir -p ~/.config/rofi
[ -e ~/.config/rofi/colors.rasi ] || ln -sf "$([ -e ~/.config/darkmode ] && echo dark || echo light).rasi" ~/.config/rofi/colors.rasi
'''

